[settings]
experimental = true
python.uv_venv_auto = "create|source"
status.show_tools = true

[settings.cargo]
binstall = true

[env]
LESS = "FRSX"
JJ_CONFIG = "{{ vars.DOTFILES }}/shared/jj"
STARSHIP_CONFIG = "{{ vars.DOTFILES }}/shared/starship.toml"

[env._.path]
paths = [
  "$HOME/bin",
  "$HOME/.cargo/bin",
  "$HOME/.local/bin",
  "{{ vars.DOTFILES }}/bin",
  "{{ vars.DOTFILES }}/platforms/{{ vars.OS }}/bin",
]

[shell_alias]
ls = "ls --color"
