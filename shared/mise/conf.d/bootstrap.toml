[vars]
DOTFILES = "{{ config_source | dirname | dirname | dirname | dirname }}"
OS = '{{ os(macos="darwin") }}'

[settings.dotfiles]
root = "{{ config_source | dirname | dirname | dirname | dirname }}/home"
default_mode = "copy"

[settings.write_targets]
dotfiles = "{{ config_source | dirname }}/conf.d/dotfiles.toml"

[tasks."dotfiles:update"]
description = "Syncs dotfiles with the remote repository and bootstraps"
run = "{{ vars.DOTFILES }}/scripts/dotfiles-update"

[bootstrap.hooks]
pre-dotfiles = "{{ vars.DOTFILES }}/scripts/pre-dotfiles"

[bootstrap.packages]
"brew:git" = "latest"
"brew:joe" = "latest"
"brew:gnu-which" = "latest"
"brew:findutils" = "latest"
"brew:gnu-sed" = "latest"
"brew:gnu-tar" = "latest"
"brew:grep" = "latest"
"brew:coreutils" = "latest"
"brew:wget" = "latest"
"brew:curl" = "latest"
