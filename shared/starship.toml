"$schema" = 'https://starship.rs/config-schema.json'

format = '''$username$hostname${custom.mozbuild}
$vcs$directory$character'''

[hostname]
ssh_only = true
style = 'bold green'
format = '[@$hostname$ssh_symbol]($style) '
ssh_symbol = ' 🌐'

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold green'

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
truncation_length = 1

[custom.mozbuild]
description = "MozillaBuild configuration"
command = "$BUILD_BASE/bin/prompt"
when = '[ ! -z "$BUILD_BASE" ]'
style = 'bold yellow'
format = '[$symbol( $output)]($style)'

[vcs]
order = ["jj", "git", "hg"]
jj_modules = "[\\[jj\\]](bold yellow) $jj_bookmark$jj_status"
git_modules = "[\\[git\\]](bold yellow) $git_branch$git_status"
hg_modules = "[\\[hg\\]](bold yellow) $hg_branch$hg_state"

[jj_bookmark]
format = "[$symbol$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style) "
style = 'bold yellow'

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
style = 'bold yellow'
only_attached = true

[hg_branch]
format = "[$symbol$branch(:$topic)]($style) "
style = 'bold yellow'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold green)'
