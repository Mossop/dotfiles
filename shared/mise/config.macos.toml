[env]
HOMEBREW_PREFIX = "{{ system_brew_prefix }}"
HOMEBREW_CELLAR = "$HOMEBREW_PREFIX/Cellar"
HOMEBREW_REPOSITORY = "$HOMEBREW_PREFIX"
BASH_SILENCE_DEPRECATION_WARNING = "1"

[env._.path]
position = "append"
paths = [
  "$HOMEBREW_PREFIX/opt/gnu-which/libexec/gnubin",
  "$HOMEBREW_PREFIX/opt/findutils/libexec/gnubin",
  "$HOMEBREW_PREFIX/opt/gnu-sed/libexec/gnubin",
  "$HOMEBREW_PREFIX/opt/make/libexec/gnubin",
  "$HOMEBREW_PREFIX/opt/gnu-tar/libexec/gnubin",
  "$HOMEBREW_PREFIX/opt/grep/libexec/gnubin",
  "$HOMEBREW_PREFIX/opt/coreutils/libexec/gnubin",
  "$HOMEBREW_PREFIX/opt/gnu-getopt/bin",
  "$HOMEBREW_PREFIX/opt/util-linux/bin",
  "$HOMEBREW_PREFIX/opt/curl/bin",
  "$HOMEBREW_PREFIX/bin",
  "$HOMEBREW_PREFIX/sbin",
]

[bootstrap.packages]
"brew:git" = "latest"
"brew:joe" = "latest"
"brew:gnu-which" = "latest"
"brew:findutils" = "latest"
"brew:gnu-sed" = "latest"
"brew:gnu-tar" = "latest"
"brew:grep" = "latest"
"brew:coreutils" = "latest"
"brew:wget" = "latest"
"brew:curl" = "latest"
"brew:mise" = { state = "absent" }

[bootstrap.user]
login_shell = "/opt/homebrew/bin/bash"

[bootstrap.macos.dock]
autohide = true
show_recents = false
magnification = true
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = false
show_status_bar = false
sort_folders_first = true
preferred_view_style = "icon"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.trackpad]
tap_to_click = true
