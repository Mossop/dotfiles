[vars]
DOTFILES = "{{ config_source | dirname | dirname | dirname | dirname }}"
OS = '{{ os(macos="darwin") }}'

[settings.dotfiles]
root = "{{ config_source | dirname | dirname | dirname | dirname }}/home"
default_mode = "copy"

[settings.write_targets]
dotfiles = "{{ config_source | dirname }}/conf.d/dotfiles.toml"

[tasks."dotfiles:update"]
description = "Syncs dotfiles with the remote repository and bootstraps"
run = "{{ vars.DOTFILES }}/scripts/dotfiles-update"

[bootstrap.hooks]
pre-dotfiles = "{{ vars.DOTFILES }}/scripts/pre-dotfiles"

[bootstrap.packages]
"brew:git" = { os = "macos" }
"brew:joe" = { os = "macos" }
"brew:gnu-which" = { os = "macos" }
"brew:findutils" = { os = "macos" }
"brew:gnu-sed" = { os = "macos" }
"brew:gnu-tar" = { os = "macos" }
"brew:grep" = { os = "macos" }
"brew:coreutils" = { os = "macos" }
"brew:wget" = { os = "macos" }
"brew:curl" = { os = "macos" }
"brew:mise" = { os = "macos", state = "absent" }

"apt:joe" = { os = "linux" }
"apt:mise" = { os = "linux", state = "absent" }
