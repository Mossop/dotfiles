Host *
	ServerAliveInterval 30
	ServerAliveCountMax 2

# Github
Host github.com
	IdentityFile "{{ vars.DOTFILES }}/shared/ssh/id_rsa_github.pub"
	IdentitiesOnly yes

# Online servers

Host bhuna
	HostName bhuna.clantownsend.com
	IdentityFile "{{ vars.DOTFILES }}/shared/ssh/id_rsa_digitalocean.pub"
	IdentitiesOnly yes
	ForwardAgent yes

# Local machines

Host tikka
	HostName tikka.clantownsend.com
	User dave

Host madras
	HostName madras.clantownsend.com
	User dave

Host ap1 ap2
	User admin

Host vindaloo-win vindaloo-linux
